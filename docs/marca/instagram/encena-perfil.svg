<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1080" height="1080">
  <!-- Foto de perfil do Instagram: o Instagram recorta em CÍRCULO, então o fundo índigo vai
       até a borda (sem o canto arredondado do ícone do app) e o E encolhe um pouco pra
       ficar folgado dentro do círculo. Mesmo desenho de web/public/marca-encena.svg. -->
  <rect width="64" height="64" fill="#0F2D5B"/>
  <g transform="translate(32 32) scale(0.86) translate(-35 -32)">
    <rect x="16" y="15" width="8" height="34" rx="2" fill="#FFFFFF"/>
    <rect x="16" y="15" width="30" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="16" y="41" width="30" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="16" y="28" width="38" height="8" rx="4" fill="#F06B4F"/>
  </g>
</svg>
